<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartSpace Hub Viewer</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e9e9ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  #scene-container {
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #scene-container.dragging {
    cursor: grabbing;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: rgba(20, 20, 22, 0.65);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 0.01em;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #status {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #444;
    font-size: 13px;
    background: rgba(255,255,255,0.7);
    padding: 6px 10px;
    border-radius: 6px;
    max-width: 60vw;
  }
  #status.error {
    color: #a11;
    background: rgba(255,235,235,0.9);
  }
</style>
</head>
<body>

<div id="scene-container"></div>
<div id="status">Loading model…</div>
<div id="hint">Click and drag to look around</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";

const MODEL_URL = "https://raw.githubusercontent.com/TomCawthray/SmartSpaceVR/main/SmartSpaceHub.fbx";

const container = document.getElementById("scene-container");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

// ---- Scene setup ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e9ec); // plain neutral background

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000000
);
camera.position.set(0, 0, 0); // static position at world origin

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ---- Simple neutral studio lighting ----
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcccccc, 1.1);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(5, 10, 7);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-6, 3, -4);
scene.add(fillLight);

const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

// ---- Load model ----
const loader = new FBXLoader();
loader.load(
  MODEL_URL,
  (object) => {
    scene.add(object);

    // Log bounding box info to help with scale troubleshooting.
    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    console.log("Model bounding box size:", size);
    console.log("Model bounding box center:", center);
    console.log(
      "If the model looks far too big or too small, adjust object.scale.set(x,x,x) in the script."
    );

    statusEl.style.display = "none";
    setTimeout(() => { hintEl.style.opacity = "0"; }, 4000);
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      statusEl.textContent = `Loading model… ${pct}%`;
    }
  },
  (error) => {
    console.error("Error loading FBX:", error);
    statusEl.textContent =
      "Failed to load model. Check the console for details (CORS or file path issue).";
    statusEl.classList.add("error");
  }
);

// ---- Mouse-drag look controls (camera stays fixed at 0,0,0) ----
let yaw = 0;
let pitch = 0;
let isDragging = false;
let lastX = 0;
let lastY = 0;

const ROTATE_SPEED = 0.0025;
const PITCH_LIMIT = Math.PI / 2 - 0.01;

camera.rotation.order = "YXZ";

function updateCameraRotation() {
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

container.addEventListener("mousedown", (e) => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  container.classList.add("dragging");
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  container.classList.remove("dragging");
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  yaw -= dx * ROTATE_SPEED;
  pitch -= dy * ROTATE_SPEED;
  pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));

  updateCameraRotation();
});

// Touch support
container.addEventListener(
  "touchstart",
  (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
  },
  { passive: true }
);

window.addEventListener("touchend", () => {
  isDragging = false;
});

window.addEventListener(
  "touchmove",
  (e) => {
    if (!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

    yaw -= dx * ROTATE_SPEED;
    pitch -= dy * ROTATE_SPEED;
    pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));

    updateCameraRotation();
  },
  { passive: true }
);

// ---- Resize handling ----
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- Render loop ----
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
